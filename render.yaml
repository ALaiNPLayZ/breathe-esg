services:
  - type: web
    name: breathe-esg
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      cd ../frontend &&
      npm ci &&
      npm run build &&
      mkdir -p ../backend/frontend_build &&
      cp -r dist/. ../backend/frontend_build/ &&
      cd ../backend &&
      python manage.py migrate --no-input &&
      python manage.py collectstatic --no-input &&
      python manage.py create_demo_data
    startCommand: gunicorn breathe_esg.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ORIGINS
        value: https://breathe-esg.onrender.com

databases:
  - name: breathe-esg-db
    plan: free
    region: oregon
